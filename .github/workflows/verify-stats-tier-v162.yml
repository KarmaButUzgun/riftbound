name: Verify Stats Tier V16.2

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build exact patch stack
        run: bash scripts/build-site.sh

      - name: Verify Stats tier resolver
        run: node scripts/verify-stats-tier-v162.mjs
