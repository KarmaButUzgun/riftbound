name: Verify Map Hotkeys V16.1

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build exact patch stack
        run: bash scripts/build-site.sh

      - name: Verify tactical-map hotkeys
        run: node scripts/verify-map-hotkeys-v161.mjs
