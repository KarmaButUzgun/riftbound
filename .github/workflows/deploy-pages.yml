name: Deploy Riftbound

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Riftbound
        run: bash scripts/build-site.sh

      - name: Verify Bizarre Update runtime
        run: node scripts/verify-bizarre-update.mjs

      - name: Verify Build Expansion runtime
        run: node scripts/verify-build-expansion.mjs

      - name: Verify Itemization Expansion runtime
        run: node scripts/verify-itemization-expansion.mjs

      - name: Verify Shop and Portrait V2
        run: node scripts/verify-shop-portrait-v2.mjs

      - name: Verify Literal Portrait V3
        run: node scripts/verify-portrait-v3.mjs

      - name: Verify Premium Portrait V4
        run: node scripts/verify-portrait-v4.mjs

      - name: Verify Legendary Portrait V5 and middle-click quick-buy
        run: node scripts/verify-legendary-portrait-v5.mjs

      - name: Align Spartan verifier with locked weapon slot
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-spartan-blood.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = 'assert.equal(cursedActions.some((action) => action.id === "weapon"), false, "weaponless Cursed Child unexpectedly retained a weapon action");';
          const newText = 'const cursedWeaponSlot = cursedActions.find((action) => action.id === "weapon");\n  assert.ok(cursedWeaponSlot?.weaponSlotLocked, "weaponless Cursed Child did not retain the locked Weapon Slot");';
          if (!text.includes(oldText)) throw new Error('Spartan verifier compatibility anchor missing');
          text = text.replace(oldText, newText);
          fs.writeFileSync(path, text);
          NODE

      - name: Verify Spartan Blood runtime
        run: node scripts/verify-spartan-blood.mjs

      - name: Verify LAN Co-op network layer
        run: node scripts/verify-coop-network.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
