name: Test Riftbound Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build exact patch stack
        run: bash scripts/build-site.sh

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-pr-site
          path: ./_site
