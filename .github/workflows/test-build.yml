name: Test Riftbound Build

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build exact patch stack
        run: bash scripts/build-site.sh

      - name: Prepare V9 verifier compatibility
        run: node scripts/prepare-v9-verifier-compat.mjs

      - name: Prepare V13 verifier compatibility
        run: node scripts/prepare-v13-verifier-compat.mjs

      - name: Prepare V13 late verifier compatibility
        run: node scripts/prepare-v13-late-verifier-compat.mjs

      - name: Prepare V14 verifier compatibility
        run: node scripts/prepare-v14-verifier-compat.mjs

      - name: Verify Bizarre Update runtime
        run: node scripts/verify-bizarre-update.mjs

      - name: Verify Build Expansion runtime
        run: node scripts/verify-build-expansion.mjs

      - name: Verify Itemization Expansion runtime
        run: node scripts/verify-itemization-expansion.mjs

      - name: Verify Shop and Portrait V2
        run: node scripts/verify-shop-portrait-v2.mjs

      - name: Verify Literal Portrait V3
        run: node scripts/verify-portrait-v3.mjs

      - name: Verify Premium Portrait V4
        run: node scripts/verify-portrait-v4.mjs

      - name: Verify Legendary Portrait V5 and middle-click quick-buy
        run: node scripts/verify-legendary-portrait-v5.mjs

      - name: Verify Reference Lore V6
        run: node scripts/verify-reference-lore-v6.mjs

      - name: Verify Shop Performance V7
        run: node scripts/verify-shop-performance-v7.mjs

      - name: Verify Major Balance + Mythical V9
        run: node scripts/verify-major-balance-mythical-v9.mjs

      - name: Verify Mythical Canon Portrait + Balance V10
        run: node scripts/verify-mythical-canon-v10.mjs

      - name: Verify Shop GUI Reflow + Mythical Alignment V11
        run: node scripts/verify-shop-gui-reflow-v11.mjs

      - name: Verify Mythical Build Paths + Early Game V12
        run: node scripts/verify-mythical-buildpaths-earlygame-v12.mjs

      - name: Verify Early Curve Hardening V12.1
        run: node scripts/verify-early-curve-hardening-v121.mjs

      - name: Verify Codex Powers Rarity Hotfix V12.2
        run: node scripts/verify-codex-powers-rarity-hotfix-v122.mjs

      - name: Verify distinct One For All Codex copy V12.3
        run: node scripts/verify-codex-ofa-copy-v123.mjs

      - name: Verify Elemental + Cursed Child Rework V13
        run: node scripts/verify-elemental-cursed-child-v13.mjs

      - name: Verify Beneath The Drowning V14
        run: node scripts/verify-btd-v14.mjs

      - name: Verify V14.2 save-load hydration
        run: node scripts/verify-v142-save-load.mjs

      - name: Verify Combat Fluidity V15
        run: node scripts/verify-combat-fluidity-v15.mjs

      - name: Verify Wayfarer QoL V16
        run: node scripts/verify-wayfarer-v16.mjs

      - name: Align Spartan verifier with locked weapon slot
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-spartan-blood.mjs';
          let text = fs.readFileSync(path, 'utf8');
          const oldText = 'assert.equal(cursedActions.some((action) => action.id === "weapon"), false, "weaponless Cursed Child unexpectedly retained a weapon action");';
          const newText = 'const cursedWeaponSlot = cursedActions.find((action) => action.id === "weapon");\n  assert.ok(cursedWeaponSlot?.weaponSlotLocked, "weaponless Cursed Child did not retain the locked Weapon Slot");';
          if (!text.includes(oldText)) throw new Error('Spartan verifier compatibility anchor missing');
          text = text.replace(oldText, newText);
          fs.writeFileSync(path, text);
          NODE

      - name: Verify Spartan Blood runtime
        run: node scripts/verify-spartan-blood.mjs

      - name: Verify LAN Co-op network layer
        run: node scripts/verify-coop-network.mjs

      - name: Verify V17-V20 consolidation runtime
        run: node scripts/verify-consolidation-v17-v20.mjs

      - name: Verify V29 authoritative co-op protocol
        run: node scripts/verify-coop-authority-v20.mjs

      - name: Verify V21-V30 Remastered release
        run: node scripts/verify-remastered-v21-v30.mjs

      - name: Verify V31 Codex Ascendant
        run: node scripts/verify-codex-ascendant-v31.mjs

      - name: Verify V31.1 mechanics-backed Codex previews
        run: node scripts/verify-codex-previews-v311.mjs

      - name: Verify V32 Restless Gambler
        run: node scripts/verify-restless-gambler-v32.mjs

      - name: Verify V33 Tactical Grammar
        run: node scripts/verify-tactical-grammar-v33.mjs

      - name: Verify V34 Battlefield VFX Grammar
        run: node scripts/verify-battlefield-vfx-v34.mjs

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: riftbound-pr-site
          path: ./_site
